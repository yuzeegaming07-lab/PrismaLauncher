name: Build Prisma Launcher APK

on:
  workflow_dispatch:
  push:
    branches: [utama]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak proyek
        run: |
          mkdir /tmp/prisma
          unzip -q *.zip -d /tmp/prisma
          cp -R /tmp/prisma/PrismaLauncher/. .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bangun APK
        run: gradle assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: PrismaLauncher-APK
          path: app/build/outputs/apk/debug/app-debug.apk
